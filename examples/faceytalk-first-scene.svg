<svg xmlns="http://www.w3.org/2000/svg" width="800" height="970" viewBox="0 0 800 970" role="img" aria-label="Word Trail 표현 카드"><rect width="100%" height="100%" fill="#eaf4fb"/><g font-family="Arial, Apple SD Gothic Neo, sans-serif" fill="#193449"><text x="40" y="48" font-size="14" fill="#267395">WORD TRAIL</text><text x="40" y="88" font-size="29" font-weight="700">Faceytalk · 첫 구간</text><g transform="translate(36 120)"><rect width="728" height="372" rx="24" fill="#fff"/><text x="32" y="44" font-size="15" fill="#267395">01 · 소리에서 글자로</text><rect x="28" y="66" width="670" height="76" rx="12" fill="#fff4c8"/><text x="42" y="115" font-size="40" font-weight="700">mum</text><text x="36" y="177" font-size="21">/mʌm/</text><text x="36" y="218" font-size="25" font-weight="600">엄마</text><text x="36" y="258" font-size="18">어머니를 친근하게 부르는 말이에요. mum은 영국·호주에서</text><text x="36" y="285" font-size="18">흔해요.</text><text x="36" y="346" font-size="15" fill="#476577">뜻을 가리고 읽기 → 소리 내어 말하기 → 내일 다시 보기</text></g><g transform="translate(36 520)"><rect width="728" height="372" rx="24" fill="#fff"/><text x="32" y="44" font-size="15" fill="#267395">02 · 소리에서 글자로</text><rect x="28" y="66" width="670" height="76" rx="12" fill="#fff4c8"/><text x="42" y="115" font-size="40" font-weight="700">please</text><text x="36" y="177" font-size="21">/pliːz/</text><text x="36" y="218" font-size="25" font-weight="600">부탁해요, 제발</text><text x="36" y="258" font-size="18">정중하게 부탁할 때 덧붙이는 말이에요.</text><text x="36" y="346" font-size="15" fill="#476577">뜻을 가리고 읽기 → 소리 내어 말하기 → 내일 다시 보기</text></g><text x="40" y="946" font-size="12">부모와 함께, 하루에 조금씩 · 학습용 발음기호 / 영상 발음과 차이가 있을 수 있어요</text></g></svg>