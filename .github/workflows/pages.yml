name: Validate Word Trail and optional GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build learning content
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run check
      - name: Configure GitHub Pages
        if: vars.DEPLOY_GITHUB_PAGES == 'true'
        uses: actions/configure-pages@v5
      - name: Upload website files
        if: vars.DEPLOY_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: vars.DEPLOY_GITHUB_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
